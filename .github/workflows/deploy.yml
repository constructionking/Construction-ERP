name: Deploy

# Zero-touch deploy: push to the deploy branch -> SSH to the server -> pull,
# rebuild, apply migrations (the compose 'migrate' service), restart.
#
# Set these repo secrets (Settings -> Secrets and variables -> Actions):
#   DEPLOY_HOST    server public IP or hostname
#   DEPLOY_USER    ssh user (e.g. root or a deploy user)
#   DEPLOY_SSH_KEY private key with access to the server
#   DEPLOY_PATH    absolute path to the repo on the server (e.g. /opt/construction-erp)
#
# Change the branch below to whatever you deploy from.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull --ff-only
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
