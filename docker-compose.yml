services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_dev_password
      POSTGRES_DB: construction_erp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d construction_erp"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for production-like runs.
  # Dev defaults to local-disk storage; start with: docker compose --profile s3 up
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: erp
      MINIO_ROOT_PASSWORD: erp_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  worker-photogrammetry:
    build: ./worker-photogrammetry
    profiles: ["scan"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://erp:erp_dev_password@postgres:5432/construction_erp
      STORAGE_DIR: /storage
    volumes:
      - ./storage:/storage
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
